<style>

    box-shadow:0 0 80px rgba(80,140,255,.18);border-radius:4px;}

  #hud .stat b{font-size:27px;font-weight:800;line-height:1;text-shadow:0 0 16px currentColor;}
  #hud .stat i{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7f8ca0;font-style:normal;margin-top:4px;}
  #hud .st-time b{color:#57d3ff;min-width:52px;text-align:center;}
  #hud .st-walls b{color:#b98bff;}
  #hud .st-len b{color:#ffd25f;font-size:34px;text-shadow:0 0 22px currentColor;}
  #hud .st-len{padding:5px 13px;}
  #hud .st-len i{color:#a8935f;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;color:#e8edf4;text-align:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;

  #overlay h1{font-size:clamp(36px,12vw,50px);margin:0 0 8px;font-weight:800;letter-spacing:.14em;
    color:#eaf2ff;text-shadow:0 0 32px rgba(95,176,255,.5),0 2px 0 rgba(0,0,0,.35);}
  #overlay p{margin:4px 0;color:#9fadc1;font-size:14px;max-width:300px;line-height:1.5;
    text-shadow:0 1px 6px rgba(6,9,14,.9);}
  #overlay b{color:#e8edf4;}
  /* centred while it fits, scrollable from the top once the leaderboard makes it taller than a phone */

  #stats{margin:8px 0 2px;color:#9fadc1;font-size:14px;}
  #stats b{color:#ffd25f;font-size:20px;}
  #stats .day{font-size:11px;letter-spacing:.06em;color:#6b7a90;margin-top:6px;}
  #startBtn{margin:16px 0 0;padding:12px 54px;color:#05121f;border:0;border-radius:999px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:linear-gradient(180deg,#84c4ff,#48a2f3);
    box-shadow:0 10px 34px rgba(72,162,243,.42);animation:breathe 2.4s ease-in-out infinite;}
  #startBtn .lbl{font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.1;}
  #startBtn .sub{font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.6;}
  #startBtn:active{transform:scale(.96);}
  .touch-only{display:none;}
  @media (pointer:coarse){#startBtn .sub{display:none;}.touch-only{display:block;}}
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 10px 34px rgba(72,162,243,.34);}
    50%{transform:scale(1.045);box-shadow:0 14px 46px rgba(72,162,243,.62);}}
  @media (prefers-reduced-motion:reduce){#startBtn{animation:none;}}
  .how{font-size:12px!important;color:#6b7a90!important;margin-top:10px!important;}
  /* on-screen arrows for touch: a d-pad (cross) under the board, in Breakin's secondary-button style (Lok's call, 2026-09-15).

  #pad .hub{grid-column:2;grid-row:2;background:#131b27;border:1px solid #243349;border-radius:14px;}
  #pad.idle{visibility:hidden;}
  #pad button{display:flex;align-items:center;justify-content:center;padding:0;
    color:#cdd6e4;background:#18222f;border:1px solid #2f3f57;border-radius:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  #pad button svg{width:26px;height:26px;fill:currentColor;}

  #pad .u{grid-column:2;grid-row:1;} #pad .l{grid-column:1;grid-row:2;}
  #pad .d{grid-column:2;grid-row:3;} #pad .r{grid-column:3;grid-row:2;}
  /* leaderboard + name box: copied from Breakin */
  #nameEntry{margin:14px 0 2px;}
  #nameEntry .ne-label{color:#8fd6a0;font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:7px;}
  #nameEntry .ne-label.warn{color:#ffcf6b;}

  #nameInput{padding:10px 12px;font-size:19px;border-radius:9px;border:1.5px solid #46587a;font-family:inherit;
    text-transform:uppercase;letter-spacing:.22em;text-align:center;font-weight:800;

  #nameInput:focus{border-color:#5fb0ff;box-shadow:0 0 0 3px rgba(95,176,255,.22);}
  #saveBtn{padding:10px 18px;font-size:14px;font-weight:700;border:0;border-radius:9px;background:#5fb0ff;color:#05121f;cursor:pointer;}

  #board{margin:22px auto 4px;width:286px;max-width:88vw;font-variant-numeric:tabular-nums;

  #board .bt{color:#67788f;font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;text-align:center;}

  #board .me{background:rgba(95,176,255,.16);}
  #board .rk{font-weight:800;color:#5c6a80;}

  #board .btab.on{color:#cfe0f5;background:#1b2636;border-color:#33455f;}

  /* feedback link + dialog: copied from Breakin */
  #fbLink{background:none;border:0;color:#6b7a90;font-size:12px;letter-spacing:.03em;
    cursor:pointer;padding:4px;margin-top:12px;text-decoration:underline;font-family:inherit;}
  #fb{position:fixed;inset:0;z-index:50;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;
    background:rgba(4,7,11,.82);padding:20px;}
  #fb .fbpanel{background:#0d1420;border:1px solid #2b3a52;border-radius:14px;padding:18px;

  #fb input,#fb textarea{width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border-radius:9px;
    border:1px solid #33455f;background:#0b1220;color:#e8edf4;outline:none;margin-bottom:10px;font-family:inherit;

  #fb button{padding:10px 18px;font-size:14px;font-weight:700;border:0;border-radius:9px;cursor:pointer;}

  #fbClose{background:#1b2637;color:#cdd6e4;}

  /* sound + pause buttons sit in the score row, right after the stone tile; same secondary-button style as the arrows.

  #hud{z-index:30;}
  #hud .hbtn{pointer-events:auto;align-self:center;width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;

  #restartBtn{margin-top:12px;padding:10px 30px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;

  #snd.off{color:#6b7a90;}
  #snd.off .w, #snd:not(.off) .x{display:none;}
  /* a phone held sideways leaves ~150px between the score row and the arrows - too small to play, so ask for upright.
     Same query as SIDEWAYS in the script, which pauses the run. */
  #rotate{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:#0a0e14;color:#e8edf4;text-align:center;padding:24px;}
  #rotate svg{width:54px;height:54px;color:#57d3ff;filter:drop-shadow(0 0 14px rgba(87,211,255,.5));}
  #rotate b{font-size:22px;font-weight:800;letter-spacing:.14em;color:#eaf2ff;text-shadow:0 0 32px rgba(95,176,255,.5);}

  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){#rotate{display:flex;}}</style>

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud" hidden>
  <div class="stat st-time"><b id="hTime">0.0</b><i>time</i></div>
  <div class="stat st-len"><b id="hLen">30</b><i>length</i></div>
  <div class="stat st-walls"><b id="hWalls">0</b><i>stone</i></div>
  <button id="snd" class="hbtn" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path class="w" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button id="pauseBtn" class="hbtn" aria-label="Pause"><svg viewBox="0 0 24 24"><path class="bars" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/><path class="play" d="M8 5l11 7-11 7z" fill="currentColor"/></svg></button>
</div>
<div id="pad" class="idle">
  <button class="u" data-d="U" aria-label="up"><svg viewBox="0 0 24 24"><path d="M12 5l8 10H4z"/></svg></button>
  <button class="l" data-d="L" aria-label="left"><svg viewBox="0 0 24 24"><path d="M5 12l10-8v16z"/></svg></button>
  <div class="hub" aria-hidden="true"></div>
  <button class="d" data-d="D" aria-label="down"><svg viewBox="0 0 24 24"><path d="M12 19L4 9h16z"/></svg></button>
  <button class="r" data-d="R" aria-label="right"><svg viewBox="0 0 24 24"><path d="M19 12L9 20V4z"/></svg></button>
</div>
<div id="overlay">
  <div class="badge" id="badge">Snake, in reverse</div>
  <h1 id="title">SNAKED</h1>
  <p id="msg">You start long. <b>Every apple makes you shorter — and faster.</b> Whatever you shed turns to stone. Eat the last apple at length 1 to win.</p>
  <div id="stats" hidden></div>
  <div id="nameEntry" hidden>
    <div class="ne-label" id="neLabel"></div>
    <div class="ne-row">
      <input id="nameInput" maxlength="6" placeholder="your name" autocomplete="off" spellcheck="false" autocapitalize="characters" autocorrect="off" aria-label="Your name, up to 6 letters or numbers">
      <button id="saveBtn">Save</button>
    </div>
  </div>
  <button id="startBtn"><span class="lbl" id="startLbl">Play</span><span class="sub" id="startSub">or press Space · arrow keys steer</span></button>
  <button id="restartBtn" hidden>Restart</button>
  <p class="how touch-only">steer with the arrow buttons, or swipe</p>
  <div id="board"></div>
  <button id="fbLink">Send feedback</button></div>
<div id="fb" hidden>
  <div class="fbpanel">
    <div class="atitle">Send feedback</div>
    <input id="fbName" maxlength="24" placeholder="name (optional)" autocomplete="off" spellcheck="false">
    <textarea id="fbMsg" maxlength="2000" placeholder="Bugs, ideas, anything — it goes straight to the dev."></textarea>
    <div class="fbrow"><button id="fbSend">Send</button><button id="fbClose">Close</button></div>
    <div id="fbOut"></div>
  </div>
</div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg>
  <b>TURN YOUR PHONE</b><span>Snaked plays upright. Your run is paused.</span></div><script>
// ---- board ---------------------------------------------------------------------------
const COLS = 15, ROWS = 24, CELL = 24, W = COLS * CELL, H = ROWS * CELL;
const DIRS = {U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0]};
const OPP = {U: 'D', D: 'U', L: 'R', R: 'L'};
const ORDER = ['U', 'R', 'D', 'L'];
const SWIPE = 18;                               // css px of finger travel that counts as a turn

// ---- the one fixed rule set -------------------------------------------------------------
// Lok's call: the same rules for everyone and nothing adjustable, so every score means the same thing.
const START_LEN = 30;       // body pieces at the start
const SHED = 2;             // pieces that turn to stone per apple
const SLOW_MS = 160;        // time per move at full length
const FAST_MS = 60;         // time per move at length 1
try { localStorage.removeItem('shed-tune'); } catch (e) {}   // forget settings an earlier build let people save

// seeded, so a daily board or a head-to-head race can hand both players the same apples later
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- state ---------------------------------------------------------------------------
let mode = 'menu', runKind = 'attract', endT = 0;
let seed, startLen, snake, occ, stones, stoneBorn, stoneCount, apple, dir, queue, elapsed, apples, acc;
let prevHead, lastTail, chomp = -1;   // where the head came from, the cell the tail just left, and an apple the head is still gliding into
let parts = [], shake = 0, deathReason = '', countT = 0;
const COUNT_S = 3;          // 3-2-1 before a run, and again when coming back from a pause. Clock stopped, so times are unchanged.

const cx = i => i % COLS, cy = i => (i / COLS) | 0;
function step1(i, d) {
  const nx = cx(i) + DIRS[d][0], ny = cy(i) + DIRS[d][1];
  return nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS ? -1 : ny * COLS + nx;
}

// Daily board: every real run on the same UTC day gets the same seed; the menu's demo bot stays random.
const today = () => new Date().toISOString().slice(0, 10);
const daySeed = d => [...d].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);
let runDay = '';
function newRun() {
  runDay = today();
  seed = runKind === 'play' ? daySeed(runDay) : (Math.random() * 4294967296) >>> 0;   // placeApple derives each apple from it
  startLen = START_LEN;
  occ = new Uint8Array(COLS * ROWS);
  stones = new Uint16Array(COLS * ROWS);
  stoneBorn = new Float32Array(COLS * ROWS);
  stoneCount = 0; elapsed = 0; apples = 0; acc = 0; queue = []; dir = 'U';
  // Lay the body out as a coil along the bottom rows, head on top and pointing into open space.
  const path = [];
  for (let y = ROWS - 2, flip = false; y >= 1 && path.length < startLen; y--, flip = !flip)
    for (let k = 0; k < COLS - 2 && path.length < startLen; k++) path.push(y * COLS + (flip ? COLS - 2 - k : 1 + k));
  snake = path.reverse();                                    // head first
  prevHead = snake[0]; lastTail = snake[snake.length - 1]; chomp = -1;
  for (const i of snake) occ[i]++;
  placeApple();
}

// An apple only goes somewhere the head can still reach, and not right under its nose.
function placeApple() {
  const head = snake[0], tail = snake[snake.length - 1];
  const seen = new Uint8Array(COLS * ROWS), stack = [head], reach = [];
  seen[head] = 1;
  while (stack.length) {
    const i = stack.pop();
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || seen[j] || stones[j] || (occ[j] && j !== tail)) continue;
      seen[j] = 1; stack.push(j);
      if (!occ[j]) reach.push(j);
    }
  }
  const far = reach.filter(j => Math.abs(cx(j) - cx(head)) + Math.abs(cy(j) - cy(head)) >= 4);
  let pool = far.length ? far : reach;
  if (!pool.length) {                                        // sealed in: any free cell, the end is coming anyway
    pool = [];
    for (let j = 0; j < COLS * ROWS; j++) if (!stones[j] && !occ[j]) pool.push(j);
  }
  // Apple n walks its own seeded shuffle of every cell and takes the first one in the pool, so two players
  // whose boards differ still get the same apple whenever that cell is open for both (a uniform pick over the pool either way).
  const r = mulberry32(seed ^ Math.imul(apples + 1, 0x9E3779B1)), inPool = new Uint8Array(COLS * ROWS), cells = [];
  for (const j of pool) inPool[j] = 1;
  for (let j = 0; j < COLS * ROWS; j++) cells.push(j);
  apple = -1;
  for (let n = cells.length; n > 0 && pool.length; n--) {
    const k = (r() * n) | 0, j = cells[k]; cells[k] = cells[n - 1];
    if (inPool[j]) { apple = j; break; }
  }
}

// the whole game in one line: the shorter you are, the faster you move
function interval() {
  const p = startLen > 1 ? 1 - (snake.length - 1) / (startLen - 1) : 1;

// ---- the demo bot (plays behind the menu, and doubles as the playtester) ----------------------
function areaFrom(start, avoid) {
  const tail = snake[snake.length - 1], seen = new Uint8Array(COLS * ROWS), stack = [start];
  seen[start] = 1; if (avoid >= 0) seen[avoid] = 1;
  let n = 0;
  while (stack.length && n < 220) {
    const i = stack.pop(); n++;
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || seen[j] || stones[j] || (occ[j] && j !== tail)) continue;
      seen[j] = 1; stack.push(j);
    }
  }
  return n;
}
function botSteer() {
  const head = snake[0], tail = snake[snake.length - 1];
  const blocked = j => stones[j] || (occ[j] && j !== tail);
  const prev = new Int32Array(COLS * ROWS).fill(-1), q = [head];
  prev[head] = head;
  let found = false;
  for (let qi = 0; qi < q.length; qi++) {
    const i = q[qi];
    if (i === apple) { found = true; break; }
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || prev[j] !== -1 || blocked(j)) continue;
      prev[j] = i; q.push(j);
    }
  }
  let choice = null;
  if (found) {
    let j = apple;
    while (prev[j] !== head) j = prev[j];
    choice = ORDER.find(d => step1(head, d) === j);
    if (areaFrom(j, head) < Math.min(snake.length + 2, 12)) choice = null;   // don't chase an apple into a dead end
  }
  if (!choice) {
    let best = -1;
    for (const d of ORDER) {
      if (snake.length > 1 && d === OPP[dir]) continue;
      const j = step1(head, d);
      if (j < 0 || blocked(j)) continue;
      const a = areaFrom(j, head);
      if (a > best) { best = a; choice = d; }
    }
  }
  if (choice) { queue.length = 0; queue.push(choice); }
}

// ---- simulation ----------------------------------------------------------------------
function burst(i, col, n) {
  const x = cx(i) * CELL + CELL / 2, y = cy(i) * CELL + CELL / 2;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 170;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.35, col});
  }
}
function step(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 2.5);
  if (mode === 'play' || mode === 'attract') {
    elapsed += dt; acc += dt * 1000;
    for (let guard = 0; guard < 8 && acc >= interval() && (mode === 'play' || mode === 'attract'); guard++) {
      acc -= interval();
      if (mode === 'attract') botSteer();
      tick();
    }
    if (chomp >= 0 && acc >= interval() * 0.85) chompFx();
  } else if (mode === 'count') {
    const shown = Math.ceil(countT);
    countT -= dt;                                            // acc is kept, so a resumed run picks up mid-glide without a jump
    if (countT <= 0) { mode = 'play'; tone(880, 0.16, 'square', 0.06); }
    else if (Math.ceil(countT) < shown) tone(440, 0.08, 'square', 0.05);
  } else if (mode === 'dying' || mode === 'won') {
    endT -= dt;
    if (endT <= 0) {
      if (runKind === 'attract') { newRun(); mode = 'attract'; }
      else showResult(mode === 'won');
    }
  }
}

// ---- drawing -------------------------------------------------------------------------
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
let scale = 1, dpr = 1;
const SIDEWAYS = matchMedia('(pointer:coarse) and (orientation:landscape) and (max-height:520px)');   // same query as #rotate's CSS
function fit() {
  if (SIDEWAYS.matches) pause();                              // turning the phone mid-run must not kill it behind the notice
  const top = parseFloat(getComputedStyle(document.getElementById('wrap')).paddingTop) || 82;
  const floor = isTouch ? pad.getBoundingClientRect().top - 10 : innerHeight - 12;   // the board always ends above the arrows
  const aw = Math.min(innerWidth - 16, 480), ah = floor - top;
  scale = Math.max(0.3, Math.min(aw / W, ah / H));
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
}
function rrect(x, y, w, h, r) {

  ctx.fill();
}
// stone colour follows the order it was shed in: the same blue -> purple -> pink -> amber run as Breakin's blocks
const STONE_STOPS = [[74, 127, 212], [140, 92, 226], [214, 82, 170], [232, 118, 82]];
function stoneColor(order) {
  const t = Math.min(1, (order - 1) / Math.max(1, startLen - 2)) * (STONE_STOPS.length - 1);
  const i = Math.min(STONE_STOPS.length - 2, Math.floor(t)), f = t - i, a = STONE_STOPS[i], b = STONE_STOPS[i + 1];
  return a.map((v, k) => Math.round(v + (b[k] - v) * f));
}
const mix = (a, b, f) => a.map((v, k) => Math.round(v + (b[k] - v) * f));
const rgb = c => 'rgb(' + c.join(',') + ')';

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  ctx.fillStyle = '#0d1420'; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.strokeStyle = 'rgba(120,150,200,.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
  ctx.stroke();

  // stone: flashes white the moment it is shed, then settles into a dimmed version of its colour.
  // It has to read as dead matter at a glance - at full speed the snake's own body and a wall
  // must never be confused, so stone is darker, flatter and squarer than anything alive.
  for (let i = 0; i < stones.length; i++) {
    if (!stones[i]) continue;
    const age = elapsed - stoneBorn[i], base = mix(stoneColor(stones[i]), [13, 20, 32], 0.45);
    const col = age < 0.35 ? mix([255, 255, 255], base, age / 0.35) : base;
    const x = cx(i) * CELL + 1.5, y = cy(i) * CELL + 1.5;
    ctx.fillStyle = rgb(col);
    rrect(x, y, CELL - 3, CELL - 3, 2);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(x + 2, y + 1.5, CELL - 7, 2);
  }

  for (const a of [apple, chomp]) {

    ctx.save(); ctx.shadowColor = '#ffd25f'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffd25f';

    ctx.restore();

  // the body reads as one continuous creature rather than loose tiles that look like stone.
  // The rules still move it one whole cell per tick; it is drawn part-way through its current move

  const n = snake.length, dying = mode === 'dying', t = Math.min(1, acc / interval());

  const pts = [at(prevHead, snake[0])];

    ctx.beginPath(); ctx.moveTo(pts[k][0], pts[k][1]); ctx.lineTo(pts[k - 1][0], pts[k - 1][1]); ctx.stroke();
  }

  ctx.save(); ctx.shadowColor = hcol; ctx.shadowBlur = 16; ctx.fillStyle = hcol;

  ctx.restore();

    const [dx, dy] = DIRS[dir];
    ctx.fillStyle = '#05121f';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + dx * 4 + dy * 4.5 * s, hy + dy * 4 + dx * 4.5 * s, 2.2, 0, Math.PI * 2);

    ctx.fillStyle = 'rgba(159,173,193,' + Math.min(0.8, 2.5 - elapsed) + ')';
    ctx.font = '600 13px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(isTouch ? 'tap the arrows to steer' : 'arrow keys to steer', W / 2, 40);
  }
  if (mode === 'count') {                                      // big 3-2-1, each number popping in and settling
    const nLeft = Math.ceil(countT), f = nLeft - countT;       // f: 0 -> 1 through each second

    ctx.shadowColor = 'rgba(95,176,255,.6)'; ctx.shadowBlur = 32; ctx.fillStyle = '#eaf2ff';

  errCount++; lastErrAt = now;
  post('shed_errors', {msg: String(msg).slice(0, 500), stack: String(stack || '').slice(0, 4000),
    ua: navigator.userAgent.slice(0, 400), url: location.href.slice(0, 400),
    extra: {mode, len: snake ? snake.length : null, apples, t: elapsed, touch: isTouch, w: innerWidth, h: innerHeight}});
}
addEventListener('error', e => reportError(e.message, e.error && e.error.stack));
addEventListener('unhandledrejection', e => reportError('unhandledrejection: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));

const gameCount = () => { try { return +localStorage.getItem('shed-games') || 0; } catch (e) { return 0; } };$('fbLink').addEventListener('click', () => { $('fb').hidden = false; $('fbOut').textContent = ''; $('fbMsg').focus(); });
$('fbClose').addEventListener('click', () => { $('fb').hidden = true; });
$('fbSend').addEventListener('click', async () => {
  const m = $('fbMsg').value.trim(), out = $('fbOut');
  if (!m) { out.classList.add('bad'); out.textContent = 'write something first'; return; }
  $('fbSend').disabled = true; out.classList.remove('bad'); out.textContent = 'sending…';
  const ok = await post('shed_feedback', {name: $('fbName').value.trim().slice(0, 24) || null, message: m.slice(0, 2000),
    meta: {games: gameCount(), ua: navigator.userAgent.slice(0, 300), w: innerWidth, h: innerHeight}});
  $('fbSend').disabled = false;
  if (!ok) { out.classList.add('bad'); out.textContent = 'could not send — check your connection and try again.'; return; }   // text kept, so Send again just works
  $('fbMsg').value = ''; out.textContent = 'thanks — sent.';
  setTimeout(() => { $('fb').hidden = true; out.textContent = ''; }, 1200);
});

// ---- shared leaderboard (shed_scores from 02-leaderboard.sql; Breakin's board, re-ranked for Snaked) -------
// Until that table exists the fetch fails and the board honestly shows this device's own runs.
const MAXBOARD = 10, BOARD_COLLAPSED = 5;
const lbOn = () => location.protocol === 'https:';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// Arcade names like Breakin: up to 6 capitals/digits, same short ban list (the SQL editor is the backstop).
const cleanName = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
const NAME_BAN = /NIGG|N1GG|FUCK|SHIT|CUNT|FAGG|KIKE|CHINK|TRANNY|WHORE|HITLER|RETARD/;
const NAME_BAN_EXACT = /^(RAPE|NAZI|FAG|SPIC|COON|GOOK|TWAT|CUM)$/;
const nameAllowed = n => !NAME_BAN.test(n) && !NAME_BAN_EXACT.test(n);
// Ranking: any win beats any loss; wins by fastest time; losses by fewest pieces left, then fastest.
const rankCmp = (a, b) => (b.won - a.won) || (a.len - b.len) || (a.secs - b.secs);
const sameRun = (a, b) => !!(a && b) && a.name === b.name && !!a.won === !!b.won && a.len === b.len && +a.secs === +b.secs;
const loadLocal = () => { try { return JSON.parse(localStorage.getItem('snaked-scores')) || []; } catch (e) { return []; } };
const onToday = s => String(s.created_at || '').slice(0, 10) === today();
const shortDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}); };
let boardView = 'today', boardPicked = false, boardExpanded = false, boardLoading = false;
let remoteAll = null, remoteToday = null, pending = null, mine = null, saveFailed = false;

async function lbFetch(todayOnly) {
  if (!lbOn()) return null;
  try {
    const r = await fetch(REST + 'shed_scores?select=name,won,len,secs,created_at&order=won.desc,len.asc,secs.asc,created_at.asc&limit=300'
      + (todayOnly ? '&created_at=gte.' + today() + 'T00:00:00Z' : ''), {headers: {apikey: SB_KEY}});
    return r.ok ? (await r.json()).map(s => ({...s, name: cleanName(s.name) || 'PLAYER', secs: +s.secs})) : null;
  } catch (e) { return null; }
}
let boardLoadT = 0;
async function refreshBoard() {
  boardLoading = lbOn() && !remoteAll;                        // only the first load says "Loading"; later refreshes keep the rows up
  renderBoard();
  if (!lbOn()) return;
  clearTimeout(boardLoadT);                                   // a request that never answers must not leave "Loading" up for good
  boardLoadT = setTimeout(() => { if (boardLoading) { boardLoading = false; renderBoard(); } }, 6000);
  const [a, t] = await Promise.all([lbFetch(false), lbFetch(true)]);
  clearTimeout(boardLoadT);
  remoteAll = a; remoteToday = t; boardLoading = false;
  // today's board is empty every morning until someone plays - show All time then, never over the player's own tap
  if (!boardPicked && boardView === 'today' && !(t || []).length && (a || []).length) boardView = 'all';
  renderBoard();
}
const rowsFor = v => (v === 'today' ? remoteToday : remoteAll) || (boardLoading ? [] : v === 'today' ? loadLocal().filter(onToday) : loadLocal());

function renderBoard() {
  const all = rowsFor(boardView).slice().sort(rankCmp), list = all.slice(0, MAXBOARD);
  const remote = boardView === 'today' ? remoteToday : remoteAll;
  const tag = DEV ? ' &middot; dev mode, runs not saved' : remote || boardLoading ? '' : ' &middot; this device';
  const empty = !rowsFor('today').length && !rowsFor('all').length;
  let html = '<div class="bt">Leaderboard' + tag + '</div>' + (empty ? '' : '<div class="btabs">'
    + [['today', 'Today'], ['all', 'All time']].map(([v, l]) => '<button class="btab' + (boardView === v ? ' on' : '') + '" data-v="' + v + '">' + l + '</button>').join('') + '</div>');
  const warn = saveFailed ? '<div class="bwarn">Could not reach the leaderboard. This run is saved on this device.</div>' : '';
  const dayLine = boardView === 'today' ? '<div class="bday">Same apples for everyone today</div>' : '';
  if (!list.length) {
    $('board').innerHTML = html + '<div class="empty">' + (boardLoading ? 'Loading scores&hellip;'
      : boardView === 'today' ? 'No runs on today&rsquo;s board yet &mdash; finish one to claim #1.' : 'Nobody has saved a run yet.') + '</div>' + warn + dayLine;
    return;
  }
  const showAll = boardExpanded || list.slice(BOARD_COLLAPSED).some(s => sameRun(s, mine));   // never hide the run just saved
  let hit = false;
  html += '<div class="grid' + (boardView === 'today' ? ' noday' : '') + '"><span class="head h-l h-rk">#</span><span class="head h-l">name</span>'
    + '<span class="head h-r h-dt">date</span><span class="head h-r">time</span><span class="head h-r h-sc">result</span>'
    + (showAll ? list : list.slice(0, BOARD_COLLAPSED)).map((s, i) => {
      const me = !hit && sameRun(s, mine) ? (hit = true, ' me') : '';
      return '<span class="rk' + (i < 3 ? ' r' + (i + 1) : '') + me + '">' + (i + 1) + '</span>'
        + '<span class="nm' + me + '">' + esc(s.name) + '</span>'
        + '<span class="dt' + me + '">' + esc(shortDate(s.created_at)) + '</span>'
        + '<span class="mx' + me + '">' + (+s.secs).toFixed(1) + 's</span>'
        + '<span class="sc' + (s.won ? ' win' : '') + me + '">' + (s.won ? 'WIN' : (s.len | 0) + ' left') + '</span>';
    }).join('') + '</div>';
  if (list.length > BOARD_COLLAPSED) html += '<button class="bmore">' + (showAll ? 'Show less' : 'Show all ' + list.length) + '</button>';
  const players = new Set(all.map(s => s.name)).size, at = all.findIndex(s => sameRun(s, mine));
  const field = players + ' player' + (players === 1 ? '' : 's') + (remote ? (boardView === 'today' ? ' today' : ' so far') : ' on this device');
  $('board').innerHTML = html + '<div class="brank">' + (at < 0 ? field : 'You are <b>#' + (at + 1) + '</b> &middot; ' + field) + '</div>' + warn + dayLine;
}
$('board').addEventListener('click', e => {
  const t = e.target.closest('.btab, .bmore');
  if (!t) return;
  if (t.classList.contains('bmore')) boardExpanded = !boardExpanded;
  else if (t.dataset.v !== boardView) { boardView = t.dataset.v; boardPicked = true; boardExpanded = false; }
  renderBoard();
});

// A finished run that would make today's top 10 gets the name box, judged on today's board (the daily race).
function offerSave() {
  if (!pending || mode !== 'over') return;
  const list = (remoteToday || loadLocal().filter(onToday)).slice().sort(rankCmp);
  const r = list.filter(s => rankCmp(s, pending) <= 0).length + 1;   // ties sit below the rows already there
  if (r > MAXBOARD) return;
  $('neLabel').classList.remove('warn');
  $('neLabel').innerHTML = (r > 1 ? '&#9733; #' + r + ' on today&rsquo;s board' : list.length ? '&#9733; Top of today&rsquo;s board' : '&#9733; First on today&rsquo;s board') + ' &mdash; add your name';
  let n = ''; try { n = cleanName(localStorage.getItem('snaked-name')); } catch (e) {}
  $('nameInput').value = n; $('saveBtn').disabled = !n; $('nameEntry').hidden = false;
}
async function saveRun() {
  const name = cleanName($('nameInput').value);
  if (!pending || !name) return;
  if (!nameAllowed(name)) { $('neLabel').textContent = 'Pick a different name — that one is not allowed.'; $('neLabel').classList.add('warn'); return; }
  try { localStorage.setItem('snaked-name', name); } catch (e) {}
  const run = {name, ...pending, created_at: new Date().toISOString()};
  pending = null; mine = run; $('nameEntry').hidden = true; $('nameInput').blur();
  try { localStorage.setItem('snaked-scores', JSON.stringify(loadLocal().concat(run).sort(rankCmp).slice(0, 50))); } catch (e) {}
  // ponytail: one try, no retry queue - a failed save says so and stays on this device. Add Breakin's queue if players hit it.
  saveFailed = lbOn() && !DEV && !await post('shed_scores', {name, won: run.won, len: run.len, apples: run.apples, secs: run.secs, ua: navigator.userAgent.slice(0, 300)});
  if (!boardPicked) boardView = 'today';
  await refreshBoard();
}
$('saveBtn').addEventListener('click', saveRun);
$('nameInput').addEventListener('input', () => {
  const c = cleanName($('nameInput').value);
  if (c !== $('nameInput').value) $('nameInput').value = c;
  $('saveBtn').disabled = !c;
});
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveRun(); } });

// ---- loop ----------------------------------------------------------------------------
runKind = 'attract'; newRun(); mode = 'attract'; fit(); keyHint(); refreshBoard();
addEventListener('resize', fit);
let last = 0;
function frame(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  try { step(dt); draw(); hud(); }
  catch (err) { reportError('loop crash: ' + (err && err.message || err), err && err.stack); }   // a thrown frame must not freeze the game silently
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
draw();

if ('serviceWorker' in navigator) {   // installable + playable offline; network-first, so a fix lands on the next load
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
