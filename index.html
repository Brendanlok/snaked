<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shed — prototype</title>
<style>
  /* Palette, tiles and buttons are copied from Breakin so the games read as one family. */
  [hidden]{display:none!important;}
  html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;
    padding-top:calc(82px + env(safe-area-inset-top,0px));}
  canvas{background:#0d1420;display:block;touch-action:none;
    box-shadow:0 0 80px rgba(80,140,255,.18);border-radius:4px;}
  #hud{position:fixed;top:calc(9px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;
    justify-content:center;gap:7px;padding:0 8px;pointer-events:none;font-variant-numeric:tabular-nums;}
  #hud .stat{display:flex;flex-direction:column;align-items:center;min-width:50px;
    background:rgba(9,13,20,.55);border-radius:13px;padding:6px 10px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  #hud .stat b{font-size:27px;font-weight:800;line-height:1;text-shadow:0 0 16px currentColor;}
  #hud .stat i{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7f8ca0;font-style:normal;margin-top:4px;}
  #hud .st-time b{color:#57d3ff;min-width:52px;text-align:center;}
  #hud .st-walls b{color:#b98bff;}
  #hud .st-len b{color:#ffd25f;font-size:34px;text-shadow:0 0 22px currentColor;}
  #hud .st-len{padding:5px 13px;}
  #hud .st-len i{color:#a8935f;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#e8edf4;text-align:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;
    background:radial-gradient(ellipse 78% 56% at 50% 40%,
      rgba(9,12,18,.8) 0%, rgba(9,12,18,.62) 46%, rgba(9,12,18,.12) 100%);
    -webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);}
  #overlay .badge{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#5f86b8;margin-bottom:6px;}
  #overlay h1{font-size:clamp(36px,12vw,50px);margin:0 0 8px;font-weight:800;letter-spacing:.14em;
    color:#eaf2ff;text-shadow:0 0 32px rgba(95,176,255,.5),0 2px 0 rgba(0,0,0,.35);}
  #overlay p{margin:4px 0;color:#9fadc1;font-size:14px;max-width:300px;line-height:1.5;
    text-shadow:0 1px 6px rgba(6,9,14,.9);}
  #overlay b{color:#e8edf4;}
  #stats{margin:8px 0 2px;color:#9fadc1;font-size:14px;}
  #stats b{color:#ffd25f;font-size:20px;}
  #startBtn{margin:16px 0 0;padding:12px 54px;color:#05121f;border:0;border-radius:999px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:linear-gradient(180deg,#84c4ff,#48a2f3);
    box-shadow:0 10px 34px rgba(72,162,243,.42);animation:breathe 2.4s ease-in-out infinite;}
  #startBtn .lbl{font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.1;}
  #startBtn .sub{font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.6;}
  #startBtn:active{transform:scale(.96);}
  .touch-only{display:none;}
  @media (pointer:coarse){#startBtn .sub{display:none;}.touch-only{display:block;}}
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 10px 34px rgba(72,162,243,.34);}
    50%{transform:scale(1.045);box-shadow:0 14px 46px rgba(72,162,243,.62);}}
  @media (prefers-reduced-motion:reduce){#startBtn{animation:none;}}
  .how{font-size:12px!important;color:#6b7a90!important;margin-top:10px!important;}
  /* on-screen arrows for touch: an inverted T under the board, in Breakin's secondary-button style.
     Laid out even when idle (visibility, not display) so the board can always be sized to sit above it. */
  #pad{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:repeat(2,54px);gap:8px;
    justify-content:center;touch-action:none;}
  #pad.idle{visibility:hidden;}
  #pad button{display:flex;align-items:center;justify-content:center;padding:0;
    color:#cdd6e4;background:#18222f;border:1px solid #2f3f57;border-radius:14px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  #pad button svg{width:26px;height:26px;fill:currentColor;}
  #pad button.on{background:#2a3a52;border-color:#48a2f3;color:#84c4ff;box-shadow:0 0 18px rgba(72,162,243,.35);}
  #pad .u{grid-column:2;grid-row:1;} #pad .l{grid-column:1;grid-row:2;}
  #pad .d{grid-column:2;grid-row:2;} #pad .r{grid-column:3;grid-row:2;}
  .proto{font-size:10px!important;letter-spacing:.24em;text-transform:uppercase;color:#4d5b70!important;margin-top:14px!important;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud" hidden>
  <div class="stat st-time"><b id="hTime">0.0</b><i>time</i></div>
  <div class="stat st-len"><b id="hLen">30</b><i>length</i></div>
  <div class="stat st-walls"><b id="hWalls">0</b><i>stone</i></div>
</div>
<div id="pad" class="idle">
  <button class="u" data-d="U" aria-label="up"><svg viewBox="0 0 24 24"><path d="M12 5l8 10H4z"/></svg></button>
  <button class="l" data-d="L" aria-label="left"><svg viewBox="0 0 24 24"><path d="M5 12l10-8v16z"/></svg></button>
  <button class="d" data-d="D" aria-label="down"><svg viewBox="0 0 24 24"><path d="M12 19L4 9h16z"/></svg></button>
  <button class="r" data-d="R" aria-label="right"><svg viewBox="0 0 24 24"><path d="M19 12L9 20V4z"/></svg></button>
</div>
<div id="overlay">
  <div class="badge" id="badge">Snake, in reverse</div>
  <h1 id="title">SHED</h1>
  <p id="msg">You start long. <b>Every apple makes you shorter — and faster.</b> Whatever you shed turns to stone. Eat the last apple at length 1 to win.</p>
  <div id="stats" hidden></div>
  <button id="startBtn"><span class="lbl" id="startLbl">Play</span><span class="sub" id="startSub">or press Space · arrow keys steer</span></button>
  <p class="how touch-only">steer with the arrow buttons, or swipe</p>
  <p class="proto">prototype</p>
</div>
<script>
// ---- board ---------------------------------------------------------------------------
const COLS = 15, ROWS = 24, CELL = 24, W = COLS * CELL, H = ROWS * CELL;
const DIRS = {U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0]};
const OPP = {U: 'D', D: 'U', L: 'R', R: 'L'};
const ORDER = ['U', 'R', 'D', 'L'];
const SWIPE = 18;                               // css px of finger travel that counts as a turn

// ---- the one fixed rule set -------------------------------------------------------------
// Lok's call: the same rules for everyone and nothing adjustable, so every score means the same thing.
const START_LEN = 30;       // body pieces at the start
const SHED = 2;             // pieces that turn to stone per apple
const SLOW_MS = 160;        // time per move at full length
const FAST_MS = 60;         // time per move at length 1
try { localStorage.removeItem('shed-tune'); } catch (e) {}   // forget settings an earlier build let people save

// seeded, so a daily board or a head-to-head race can hand both players the same apples later
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- state ---------------------------------------------------------------------------
let mode = 'menu', runKind = 'attract', endT = 0;
let rng, startLen, snake, occ, stones, stoneBorn, stoneCount, apple, dir, queue, elapsed, apples, acc;
let parts = [], shake = 0, deathReason = '', countT = 0;
const COUNT_S = 3;          // 3-2-1 before a run, and again when coming back from a pause. Clock stopped, so times are unchanged.

const cx = i => i % COLS, cy = i => (i / COLS) | 0;
function step1(i, d) {
  const nx = cx(i) + DIRS[d][0], ny = cy(i) + DIRS[d][1];
  return nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS ? -1 : ny * COLS + nx;
}

function newRun() {
  rng = mulberry32((Math.random() * 4294967296) >>> 0);
  startLen = START_LEN;
  occ = new Uint8Array(COLS * ROWS);
  stones = new Uint16Array(COLS * ROWS);
  stoneBorn = new Float32Array(COLS * ROWS);
  stoneCount = 0; elapsed = 0; apples = 0; acc = 0; queue = []; dir = 'U';
  // Lay the body out as a coil along the bottom rows, head on top and pointing into open space.
  const path = [];
  for (let y = ROWS - 2, flip = false; y >= 1 && path.length < startLen; y--, flip = !flip)
    for (let k = 0; k < COLS - 2 && path.length < startLen; k++) path.push(y * COLS + (flip ? COLS - 2 - k : 1 + k));
  snake = path.reverse();                                    // head first
  for (const i of snake) occ[i]++;
  placeApple();
}

// An apple only goes somewhere the head can still reach, and not right under its nose.
function placeApple() {
  const head = snake[0], tail = snake[snake.length - 1];
  const seen = new Uint8Array(COLS * ROWS), stack = [head], reach = [];
  seen[head] = 1;
  while (stack.length) {
    const i = stack.pop();
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || seen[j] || stones[j] || (occ[j] && j !== tail)) continue;
      seen[j] = 1; stack.push(j);
      if (!occ[j]) reach.push(j);
    }
  }
  const far = reach.filter(j => Math.abs(cx(j) - cx(head)) + Math.abs(cy(j) - cy(head)) >= 4);
  let pool = far.length ? far : reach;
  if (!pool.length) {                                        // sealed in: any free cell, the end is coming anyway
    pool = [];
    for (let j = 0; j < COLS * ROWS; j++) if (!stones[j] && !occ[j]) pool.push(j);
  }
  apple = pool.length ? pool[(rng() * pool.length) | 0] : -1;
}

// the whole game in one line: the shorter you are, the faster you move
function interval() {
  const p = startLen > 1 ? 1 - (snake.length - 1) / (startLen - 1) : 1;
  return SLOW_MS + (FAST_MS - SLOW_MS) * Math.min(1, Math.max(0, p));
}

function tick() {
  if (queue.length) { const d = queue.shift(); if (!(snake.length > 1 && d === OPP[dir])) dir = d; }
  const head = snake[0], ni = step1(head, dir), tail = snake[snake.length - 1];
  if (ni < 0) return die('Hit the edge');
  if (stones[ni]) return die('Hit your own stone');
  if (occ[ni] && ni !== tail) return die('Ran into yourself');
  occ[tail]--; snake.pop();                                  // the tail moves off first, so chasing it is legal
  snake.unshift(ni); occ[ni]++;
  if (ni === apple) {
    apples++;
    burst(ni, '#ffd25f', 14);
    if (snake.length === 1) return win();
    const k = Math.min(SHED, snake.length - 1);
    for (let s = 0; s < k; s++) {
      const t = snake.pop(); occ[t]--;
      stones[t] = ++stoneCount; stoneBorn[t] = elapsed;
    }
    placeApple();
  }
}

function die(reason) {
  deathReason = reason; mode = 'dying'; endT = runKind === 'play' ? 1.0 : 1.2;
  shake = 1; burst(snake[0], '#ff5a6e', 28);
}
function win() {
  mode = 'won'; endT = 1.4;
  for (let n = 0; n < 4; n++) burst(snake[0], n % 2 ? '#ffd25f' : '#57d3ff', 26);
}

// ---- the demo bot (plays behind the menu, and doubles as the playtester) ----------------------
function areaFrom(start, avoid) {
  const tail = snake[snake.length - 1], seen = new Uint8Array(COLS * ROWS), stack = [start];
  seen[start] = 1; if (avoid >= 0) seen[avoid] = 1;
  let n = 0;
  while (stack.length && n < 220) {
    const i = stack.pop(); n++;
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || seen[j] || stones[j] || (occ[j] && j !== tail)) continue;
      seen[j] = 1; stack.push(j);
    }
  }
  return n;
}
function botSteer() {
  const head = snake[0], tail = snake[snake.length - 1];
  const blocked = j => stones[j] || (occ[j] && j !== tail);
  const prev = new Int32Array(COLS * ROWS).fill(-1), q = [head];
  prev[head] = head;
  let found = false;
  for (let qi = 0; qi < q.length; qi++) {
    const i = q[qi];
    if (i === apple) { found = true; break; }
    for (const d of ORDER) {
      const j = step1(i, d);
      if (j < 0 || prev[j] !== -1 || blocked(j)) continue;
      prev[j] = i; q.push(j);
    }
  }
  let choice = null;
  if (found) {
    let j = apple;
    while (prev[j] !== head) j = prev[j];
    choice = ORDER.find(d => step1(head, d) === j);
    if (areaFrom(j, head) < Math.min(snake.length + 2, 12)) choice = null;   // don't chase an apple into a dead end
  }
  if (!choice) {
    let best = -1;
    for (const d of ORDER) {
      if (snake.length > 1 && d === OPP[dir]) continue;
      const j = step1(head, d);
      if (j < 0 || blocked(j)) continue;
      const a = areaFrom(j, head);
      if (a > best) { best = a; choice = d; }
    }
  }
  if (choice) { queue.length = 0; queue.push(choice); }
}

// ---- player input --------------------------------------------------------------------
const live = () => mode === 'play' || mode === 'count';   // turns can be lined up during the countdown
function turn(d) {
  if (!live()) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d === last || (snake.length > 1 && d === OPP[last])) return;
  if (queue.length < 3) queue.push(d);                     // buffered, so fast double-turns aren't dropped
}
let swipe = null;
document.addEventListener('pointerdown', e => { if (live() && !e.target.closest('#pad')) swipe = {x: e.clientX, y: e.clientY}; });
document.addEventListener('pointermove', e => {
  if (!swipe || !live()) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  swipe = {x: e.clientX, y: e.clientY};                      // re-anchor: one continuous drag can carry several turns
});
const endSwipe = () => { swipe = null; };
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
// On-screen arrows: a turn lands on pointerdown, the instant a thumb touches, not on release.
const isTouch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0 || /[?&]touch/.test(location.search);
const pad = document.getElementById('pad');
if (!isTouch) pad.hidden = true;
for (const b of pad.querySelectorAll('button')) {
  b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.d); b.classList.add('on'); });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
}
const KEYS = {ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R'};
addEventListener('keydown', e => {
  if (KEYS[e.key] && live()) { e.preventDefault(); turn(KEYS[e.key]); return; }
  if ((e.key === ' ' || e.code === 'Space' || e.key === 'Enter') && !$('overlay').hidden && !e.repeat) { e.preventDefault(); startPlay(); }
});
// Keys only reach the game once the page has focus (a fresh tab with the address bar focused, or an
// embed like itch.io before its first click), so the menu only offers Space when it will actually work.
function keyHint() {
  $('startSub').textContent = document.hasFocus() ? 'or press Space · arrow keys steer' : 'click to play · then arrow keys steer';
}
addEventListener('focus', keyHint); addEventListener('blur', keyHint);

// ---- simulation ----------------------------------------------------------------------
function burst(i, col, n) {
  const x = cx(i) * CELL + CELL / 2, y = cy(i) * CELL + CELL / 2;
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 170;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.35, col});
  }
}
function step(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 2.5);
  if (mode === 'play' || mode === 'attract') {
    elapsed += dt; acc += dt * 1000;
    for (let guard = 0; guard < 8 && acc >= interval() && (mode === 'play' || mode === 'attract'); guard++) {
      acc -= interval();
      if (mode === 'attract') botSteer();
      tick();
    }
  } else if (mode === 'count') {
    countT -= dt;
    if (countT <= 0) { mode = 'play'; acc = 0; }
  } else if (mode === 'dying' || mode === 'won') {
    endT -= dt;
    if (endT <= 0) {
      if (runKind === 'attract') { newRun(); mode = 'attract'; }
      else showResult(mode === 'won');
    }
  }
}

// ---- drawing -------------------------------------------------------------------------
const canvas = document.getElementById('cv'), ctx = canvas.getContext('2d');
let scale = 1, dpr = 1;
function fit() {
  const top = parseFloat(getComputedStyle(document.getElementById('wrap')).paddingTop) || 82;
  const floor = isTouch ? pad.getBoundingClientRect().top - 10 : innerHeight - 12;   // the board always ends above the arrows
  const aw = Math.min(innerWidth - 16, 480), ah = floor - top;
  scale = Math.max(0.3, Math.min(aw / W, ah / H));
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = W * scale + 'px'; canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
// stone colour follows the order it was shed in: the same blue -> purple -> pink -> amber run as Breakin's blocks
const STONE_STOPS = [[74, 127, 212], [140, 92, 226], [214, 82, 170], [232, 118, 82]];
function stoneColor(order) {
  const t = Math.min(1, (order - 1) / Math.max(1, startLen - 2)) * (STONE_STOPS.length - 1);
  const i = Math.min(STONE_STOPS.length - 2, Math.floor(t)), f = t - i, a = STONE_STOPS[i], b = STONE_STOPS[i + 1];
  return a.map((v, k) => Math.round(v + (b[k] - v) * f));
}
const mix = (a, b, f) => a.map((v, k) => Math.round(v + (b[k] - v) * f));
const rgb = c => 'rgb(' + c.join(',') + ')';

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
  ctx.fillStyle = '#0d1420'; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.strokeStyle = 'rgba(120,150,200,.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
  ctx.stroke();

  // stone: flashes white the moment it is shed, then settles into a dimmed version of its colour.
  // It has to read as dead matter at a glance - at full speed the snake's own body and a wall
  // must never be confused, so stone is darker, flatter and squarer than anything alive.
  for (let i = 0; i < stones.length; i++) {
    if (!stones[i]) continue;
    const age = elapsed - stoneBorn[i], base = mix(stoneColor(stones[i]), [13, 20, 32], 0.45);
    const col = age < 0.35 ? mix([255, 255, 255], base, age / 0.35) : base;
    const x = cx(i) * CELL + 1.5, y = cy(i) * CELL + 1.5;
    ctx.fillStyle = rgb(col);
    rrect(x, y, CELL - 3, CELL - 3, 2);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(x + 2, y + 1.5, CELL - 7, 2);
  }

  if (apple >= 0 && mode !== 'won') {
    const r = CELL * 0.3 + Math.sin(performance.now() / 120) * 1.3;
    ctx.save(); ctx.shadowColor = '#ffd25f'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffd25f';
    ctx.beginPath(); ctx.arc(cx(apple) * CELL + CELL / 2, cy(apple) * CELL + CELL / 2, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // the snake: cyan head fading to purple, red when it dies. Neighbouring segments are bridged so
  // the body reads as one continuous creature rather than loose tiles that look like stone.
  const n = snake.length, dying = mode === 'dying';
  for (let k = n - 1; k >= 1; k--) {
    const a = snake[k], b = snake[k - 1], f = n > 1 ? (k - 0.5) / (n - 1) : 0;
    ctx.fillStyle = rgb(dying ? [255, 90, 110] : mix([87, 211, 255], [185, 139, 255], f));
    const x = Math.min(cx(a), cx(b)) * CELL + 2.5, y = Math.min(cy(a), cy(b)) * CELL + 2.5;
    ctx.fillRect(x + (cx(a) !== cx(b) ? CELL / 2 : 0), y + (cy(a) !== cy(b) ? CELL / 2 : 0),
                 cx(a) !== cx(b) ? CELL : CELL - 5, cy(a) !== cy(b) ? CELL : CELL - 5);
  }
  for (let k = n - 1; k >= 0; k--) {
    const i = snake[k], f = n > 1 ? k / (n - 1) : 0;
    const col = dying ? [255, 90, 110] : mix([87, 211, 255], [185, 139, 255], f);
    const inset = k === 0 ? 1 : 2.5;
    if (k === 0) { ctx.save(); ctx.shadowColor = rgb(col); ctx.shadowBlur = 16; }
    ctx.fillStyle = rgb(col);
    rrect(cx(i) * CELL + inset, cy(i) * CELL + inset, CELL - inset * 2, CELL - inset * 2, k === 0 ? 7 : 5);
    if (k === 0) ctx.restore();
  }
  if (n) {                                                    // eyes, looking where it's heading
    const h = snake[0], hx = cx(h) * CELL + CELL / 2, hy = cy(h) * CELL + CELL / 2, [dx, dy] = DIRS[dir];
    ctx.fillStyle = '#05121f';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + dx * 4 + dy * 4.5 * s, hy + dy * 4 + dx * 4.5 * s, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.5)); ctx.fillStyle = p.col; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;

  if ((mode === 'play' || (mode === 'count' && elapsed === 0)) && elapsed < 2.5) {
    ctx.fillStyle = 'rgba(159,173,193,' + Math.min(0.8, 2.5 - elapsed) + ')';
    ctx.font = '600 13px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(isTouch ? 'tap the arrows to steer' : 'arrow keys to steer', W / 2, 40);
  }
  if (mode === 'count') {                                      // big 3-2-1, each number popping in and settling
    const nLeft = Math.ceil(countT), f = nLeft - countT;       // f: 0 -> 1 through each second
    ctx.fillStyle = 'rgba(9,12,18,.45)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (elapsed > 0) { ctx.fillStyle = '#9fadc1'; ctx.font = '700 13px -apple-system,Segoe UI,Roboto,sans-serif'; ctx.fillText('PAUSED', W / 2, H / 2 - 70); }
    ctx.globalAlpha = Math.min(1, 1.6 - f);
    ctx.font = '800 ' + Math.round(96 - 22 * Math.min(1, f * 3)) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.shadowColor = 'rgba(95,176,255,.6)'; ctx.shadowBlur = 32; ctx.fillStyle = '#eaf2ff';
    ctx.fillText(nLeft, W / 2, H / 2);
    ctx.restore();
  }
}

// ---- screens -------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function startPlay() {
  runKind = 'play'; newRun(); mode = 'count'; countT = COUNT_S; swipe = null;
  pad.classList.remove('idle');
  $('overlay').hidden = true; $('hud').hidden = false;
  $('hTime').textContent = '0.0'; $('hLen').textContent = snake.length; $('hWalls').textContent = 0;
}
// A locked phone, a notification or a switched tab freezes the run; coming back counts 3-2-1 again.
function pause() {
  if (!live()) return;
  mode = 'count'; countT = COUNT_S; queue.length = 0; swipe = null;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);
function showResult(won) {
  mode = 'over';
  $('badge').textContent = won ? 'Fully shed' : deathReason;
  $('title').textContent = won ? 'SHED!' : 'GAME OVER';
  $('msg').innerHTML = won ? 'You ate your way down to nothing.' : 'Shed the rest of it next time.';
  $('stats').hidden = false;
  $('stats').innerHTML = won
    ? 'Time <b>' + elapsed.toFixed(1) + 's</b>'
    : 'Length left <b>' + snake.length + '</b> &nbsp;·&nbsp; Time <b>' + elapsed.toFixed(1) + 's</b>';
  $('startLbl').textContent = 'Play again';
  $('overlay').hidden = false; $('hud').hidden = true;
  pad.classList.add('idle');
}
function hud() {
  if (mode !== 'play') return;
  $('hTime').textContent = elapsed.toFixed(1); $('hLen').textContent = snake.length; $('hWalls').textContent = stoneCount;
}
$('startBtn').addEventListener('click', startPlay);

// ---- loop ----------------------------------------------------------------------------
runKind = 'attract'; newRun(); mode = 'attract'; fit(); keyHint();
addEventListener('resize', fit);
let last = 0;
function frame(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  step(dt); draw(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
draw();
</script>
</body>
</html>
